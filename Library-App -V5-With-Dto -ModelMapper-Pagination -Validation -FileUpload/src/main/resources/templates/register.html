<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::mybaselayout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<section>

		<div class="container mt-4">
			<div class="row">
				<div class="col-md-6 offset-3">

					<form th:action ="@{/save}" method="post" th:object="${userdto}" enctype="multipart/form-data">
						<div class="form-group">
							<label for="nm">Name</label>
							 <input	type="text" th:field="*{name}" class="form-control" id="exampleInputEmail1"
								aria-describedby="emailHelp">
								<div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
						</div>
						
						<div class="form-group">
							<label for="email">email</label> 
							<input type="email" th:field="*{email}" class="form-control" id="exampleInputPassword1">
							<div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
						</div>
						
						<div class="form-group">
							<label for="text">Address</label> 
							<input type="text" th:field="*{address}" class="form-control" id="exampleInputPassword1">
							<div class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
						</div>
						
						<div class="form-group">
							<label for="">Aadhar</label> 
							<input type="number" th:field="*{aadhar}" class="form-control" id="exampleInputPassword1">
							<div class="text-danger" th:if="${#fields.hasErrors('aadhar')}" th:errors="*{aadhar}"></div>
						</div>
						
						<div class="form-group">
							<label for="email">Pan</label>
							 <input type="text" th:field="*{pan}" class="form-control" id="exampleInputPassword1">
							<div class="text-danger" th:if="${#fields.hasErrors('pan')}" th:errors="*{pan}"></div>
						</div>
						
						<div class="form-group">
							<label for="password">Password</label>
							 <input type="password" th:field="*{password}" class="form-control" id="exampleInputPassword1">
							<div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
						</div>
						
						<!-- image upload -->
						<div class="form-group">
							<label for="image">Image Upload</label>
							 <input type="file" name="imgpart" class="form-control" id="exampleInputPassword1">
							
						</div>
						
						<!-- file upload -->
						<div class="form-group">
							<label for="image">Upload pdf</label>
							 <input type="file" name="pdfpart" class="form-control" id="exampleInputPassword1">
							
						</div>
						
						<button type="submit" class="btn btn-primary">Submit</button>
					</form>

				</div>
			</div>

		</div>

	</section>
	
</body>
</html>
