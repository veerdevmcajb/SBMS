<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base::mybaselayout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

<section>
		<h2>Edit User-Info</h2>
		<div class="container mt-4">
			<div class="row">
				<div class="col-md-6 offset-3">

					<form th:action ="@{/update}" method="post" th:object="${userdto}">
					
					<input	type="hidden"
					th:field="*{id}" class="form-control" id="exampleInputEmail1"
								aria-describedby="emailHelp">
								
								
						<div class="form-group">
							<label for="nm">Name</label>
							 <input	type="text" th:field="*{name}" class="form-control" id="exampleInputEmail1"
								aria-describedby="emailHelp">
						</div>
						
						<div class="form-group">
							<label for="email">email</label> 
							<input type="email" th:field="*{email}" class="form-control" id="exampleInputPassword1">
						</div>
						
						<div class="form-group">
							<label for="text">Address</label> 
							<input type="text" th:field="*{address}" class="form-control" id="exampleInputPassword1">
						</div>
						
						<div class="form-group">
							<label for="">Aadhar</label> 
							<input type="number" th:field="*{aadhar}" class="form-control" id="exampleInputPassword1">
						</div>
						
						<div class="form-group">
							<label for="email">Pan</label>
							 <input type="text" th:field="*{pan}" class="form-control" id="exampleInputPassword1">
						</div>
						
						<div class="form-group">
							<label for="password">Password</label>
							 <input type="text" th:field="*{password}" class="form-control" id="exampleInputPassword1">
						</div>
						
						<button type="submit" class="btn btn-primary">Update</button>
					</form>

				</div>
			</div>

		</div>

	</section>

</body>
</html>
